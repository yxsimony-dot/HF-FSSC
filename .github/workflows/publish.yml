name: Publish Windows update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    env:
      PROJECT_PATH: FSSCWebLauncher/FSSCWebLauncher.csproj
      PUBLISH_DIRECTORY: publish/FSSCWebLauncher-win-x64
      DIST_DIRECTORY: dist
      PACKAGE_NAME: FSSCWebLauncher-win-x64.zip
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64 application
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $env:PUBLISH_DIRECTORY `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:Version=$env:VERSION `
            -p:SourceRevisionId=$env:GITHUB_SHA `
            -p:ContinuousIntegrationBuild=true

      - name: Create package and update manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:DIST_DIRECTORY -Force | Out-Null

          $packagePath = Join-Path $env:DIST_DIRECTORY $env:PACKAGE_NAME
          Compress-Archive `
            -Path "$env:PUBLISH_DIRECTORY/*" `
            -DestinationPath $packagePath `
            -CompressionLevel Optimal

          $sha256 = (Get-FileHash -Path $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $env:VERSION
            commit = $env:GITHUB_SHA
            publishedAt = (Get-Date).ToUniversalTime().ToString("O")
            assetName = $env:PACKAGE_NAME
            packageSize = (Get-Item -LiteralPath $packagePath).Length
            sha256 = $sha256
          }

          $manifest |
            ConvertTo-Json |
            Set-Content `
              -Path (Join-Path $env:DIST_DIRECTORY "update-manifest.json") `
              -Encoding utf8NoBOM

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $packagePath = Join-Path $env:DIST_DIRECTORY $env:PACKAGE_NAME
          $manifestPath = Join-Path $env:DIST_DIRECTORY "update-manifest.json"

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag `
              --repo $env:GITHUB_REPOSITORY `
              --cleanup-tag `
              --yes
          }

          gh release create $tag `
            $packagePath `
            $manifestPath `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "FSSCWebLauncher $env:VERSION" `
            --notes "Automated Windows x64 build from commit $env:GITHUB_SHA."
